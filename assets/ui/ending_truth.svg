      <rect x="224" y="208" width="36" height="80" opacity="0.4"/><rect x="270" y="230" width="26" height="58" opacity="0.3"/>
      <rect x="310" y="202" width="42" height="86" opacity="0.5"/><rect x="364" y="220" width="30" height="68" opacity="0.35"/>
      <rect x="404" y="212" width="42" height="76" opacity="0.4"/>
      <rect x="64" y="330" width="40" height="78" opacity="0.4"/><rect x="116" y="342" width="30" height="66" opacity="0.3"/>
      <rect x="158" y="326" width="36" height="82" opacity="0.5"/><rect x="206" y="350" width="26" height="58" opacity="0.25"/>
      <rect x="246" y="334" width="44" height="74" opacity="0.4"/><rect x="302" y="352" width="30" height="56" opacity="0.3"/>
      <rect x="344" y="330" width="38" height="78" opacity="0.45"/><rect x="394" y="346" width="46" height="62" opacity="0.3"/>
      <rect x="64" y="452" width="32" height="76" opacity="0.35"/><rect x="108" y="466" width="44" height="62" opacity="0.3"/>
      <rect x="164" y="448" width="36" height="80" opacity="0.45"/><rect x="214" y="470" width="28" height="58" opacity="0.25"/>
