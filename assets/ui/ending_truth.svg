<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Финал — истина</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b19"/><stop offset="0.55" stop-color="#1d2723"/><stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b332d"/><stop offset="1" stop-color="#0c100e"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#d8dcc6" stop-opacity="0.55"/><stop offset="0.6" stop-color="#aab6a1" stop-opacity="0.18"/><stop offset="1" stop-color="#aab6a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe0a0" stop-opacity="0.9"/><stop offset="0.25" stop-color="#e6ae58" stop-opacity="0.4"/><stop offset="0.65" stop-color="#b0762d" stop-opacity="0.12"/><stop offset="1" stop-color="#b0762d" stop-opacity="0"/>
