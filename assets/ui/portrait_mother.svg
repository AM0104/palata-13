  <path d="M0 64h360M0 158h360M0 322h360" stroke="#070d0b" stroke-width="8" opacity="0.35"/>
  <path d="M44 0v480M316 0v480" stroke="#050a09" stroke-width="8" opacity="0.4"/>
  <circle cx="66" cy="120" r="150" fill="url(#window)"/>

  <!-- shoulders, nurse uniform -->
  <path d="M40 480c2-76 50-116 140-116s138 40 140 116z" fill="url(#dress)"/>
  <path d="M40 480c2-76 50-116 140-116" fill="none" stroke="#efeadd" stroke-width="2" opacity="0.3"/>
  <path d="M158 364l22 34 22-34 18 8-40 62-40-62z" fill="#b9b3a2" opacity="0.8"/>
  <path d="M180 398v82" stroke="#a49f90" stroke-width="2" opacity="0.6"/>
  <path d="M120 392c18 10 40 14 60 14s42-4 60-14" fill="none" stroke="#a8a494" stroke-width="2" opacity="0.6"/>
  <path d="M96 400h28v14H96zM236 400h28v14h-28z" fill="#c9c4b3" opacity="0.7"/>

  <!-- neck -->
  <path d="M156 250h48v88h-48z" fill="#cbb09b"/>
  <path d="M156 262c16 10 32 10 48 0v20c-16 10-32 10-48 0z" fill="#b3957f"/>

  <!-- ears -->
  <ellipse cx="110" cy="180" rx="13" ry="22" fill="#d6b8a2" stroke="#141119" stroke-width="2"/>
  <ellipse cx="250" cy="180" rx="13" ry="22" fill="#d6b8a2" stroke="#141119" stroke-width="2"/>

  <!-- face -->
  <path d="M180 96c44 0 68 30 68 82 0 54-28 94-68 94s-68-40-68-94c0-52 24-82 68-82z" fill="#dfc5b2" stroke="#141119" stroke-width="2.5"/>
  <path d="M112 174c-2 24 4 52 18 70-18-12-28-40-28-66 0-16 4-28 10-38z" fill="#c9a892" stroke="none"/>
  <path d="M248 174c2 24-4 52-18 70 18-12 28-40 28-66 0-16-4-28-10-38z" fill="#c9a892" stroke="none"/>
