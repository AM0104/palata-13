<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <title>Ирина Соколова — портрет</title>
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1d2422"/><stop offset="0.6" stop-color="#27302c"/><stop offset="1" stop-color="#0d1110"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#d9d4c4"/><stop offset="0.6" stop-color="#c3bead"/><stop offset="1" stop-color="#8e8a7c"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfd8cd" stop-opacity="0.34"/><stop offset="0.5" stop-color="#9fae9f" stop-opacity="0.1"/><stop offset="1" stop-color="#9fae9f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.68" stop-color="#000" stop-opacity="0.12"/><stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="tiles" width="84" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 0h84M0 30h84M0 0v60M42 0v60" stroke="#0b1211" stroke-width="2" opacity="0.4"/>
      <path d="M0 2h84M0 32h84" stroke="#5a6b62" stroke-width="1" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="360" height="480" fill="url(#bg)"/>
