  <path d="M132 154c10-5 22-5 32 0M228 154c-10-5-22-5-32 0" fill="none" stroke="#3a2a22" stroke-width="4.5" stroke-linecap="round"/>

  <!-- tired eyes -->
  <ellipse cx="150" cy="174" rx="17" ry="12" fill="#f0e9dc" stroke="#8f6f5c" stroke-width="1.5"/>
  <ellipse cx="210" cy="174" rx="17" ry="12" fill="#f0e9dc" stroke="#8f6f5c" stroke-width="1.5"/>
  <circle cx="151" cy="175" r="7" fill="#4a5a4e"/>
  <circle cx="209" cy="175" r="7" fill="#4a5a4e"/>
  <circle cx="151" cy="175" r="3.4" fill="#101615"/>
  <circle cx="209" cy="175" r="3.4" fill="#101615"/>
  <circle cx="153" cy="172" r="1.8" fill="#fbf7ea"/>
  <circle cx="211" cy="172" r="1.8" fill="#fbf7ea"/>
  <path d="M132 170c10-5 22-5 32 0M228 170c-10-5-22-5-32 0" fill="none" stroke="#b08b74" stroke-width="1.5"/>
  <path d="M133 188c8 5 18 6 26 3M227 188c-8 5-18 6-26 3" fill="none" stroke="#b8927b" stroke-width="1.7" opacity="0.75"/>
  <path d="M136 196c7 2 14 2 20 0M224 196c-7 2-14 2-20 0" fill="none" stroke="#c09b84" stroke-width="1.3" opacity="0.55"/>

