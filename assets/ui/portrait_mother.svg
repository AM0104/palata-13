  <path d="M180 182v22c0 6-4 10-9 12" fill="none" stroke="#a9856f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M171 216c4 3 10 4 15 2" fill="none" stroke="#8d6a58" stroke-width="1.8"/>

  <!-- mouth, tired half-smile -->
  <path d="M158 234c10-5 32-5 44 0-8 7-34 7-44 0z" fill="#8a4f49" stroke="#63332f" stroke-width="1.5"/>
  <path d="M166 244c10 3 20 3 28 0" fill="none" stroke="#a67f68" stroke-width="1.5" opacity="0.7"/>
  <path d="M224 238c4 3 6 6 6 10" fill="none" stroke="#b8927b" stroke-width="1.5" opacity="0.5"/>
  <path d="M132 232c4 5 8 8 13 9" fill="none" stroke="#b8927b" stroke-width="1.5" opacity="0.4"/>

  <!-- faded photo treatment -->
  <rect width="360" height="480" fill="#c8b98f" opacity="0.05"/>
  <path d="M0 380h360v100H0z" fill="#0b0e0c" opacity="0.18"/>
  <path d="M24 452l60-4M300 60l30 10M40 40l18 16" stroke="#e6dfcd" stroke-width="1" opacity="0.12"/>
  <rect width="360" height="480" fill="url(#vig)"/>
  <rect x="10" y="10" width="340" height="460" fill="none" stroke="#e6dfcd" stroke-width="2" opacity="0.12"/>
