  <path d="M180 92c-38 0-62 22-66 58-2-34 8-58 28-70 14-9 32-12 48-10 24 3 42 18 48 44-8-16-28-22-58-22z" fill="#4a3527" stroke="#141119" stroke-width="2"/>
  <path d="M112 148c-4-30 8-52 30-62-14 14-22 34-24 62z" fill="#5c4231"/>
  <path d="M248 148c4-30-8-52-30-62 14 14 22 34 24 62z" fill="#3b2a1f"/>
  <circle cx="180" cy="88" r="26" fill="#4a3527" stroke="#141119" stroke-width="2"/>
  <path d="M166 70c8-6 20-6 28 0" fill="none" stroke="#6b4c38" stroke-width="2" opacity="0.7"/>
