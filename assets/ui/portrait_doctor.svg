      <stop offset="0" stop-color="#0e1614"/><stop offset="0.55" stop-color="#182420"/><stop offset="1" stop-color="#050908"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b7b6a5"/><stop offset="0.45" stop-color="#8f9183"/><stop offset="1" stop-color="#4f544a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#b0a690"/><stop offset="0.45" stop-color="#968c77"/><stop offset="1" stop-color="#5f5a4d"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf82" stop-opacity="0.5"/><stop offset="0.45" stop-color="#c98a3e" stop-opacity="0.14"/><stop offset="1" stop-color="#c98a3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.64" stop-color="#000" stop-opacity="0.2"/><stop offset="1" stop-color="#000" stop-opacity="0.86"/>
    </radialGradient>
