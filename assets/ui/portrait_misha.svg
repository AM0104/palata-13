<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <title>Миша Соколов — портрет</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#101a19"/><stop offset="0.6" stop-color="#172523"/><stop offset="1" stop-color="#080d0c"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#33524f"/><stop offset="0.55" stop-color="#27403e"/><stop offset="1" stop-color="#182a29"/>
    </linearGradient>
    <radialGradient id="torch" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88f" stop-opacity="0.55"/><stop offset="0.45" stop-color="#e9a94e" stop-opacity="0.18"/><stop offset="1" stop-color="#e9a94e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.7" stop-color="#000" stop-opacity="0.15"/><stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <pattern id="tiles" width="72" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 0h72M0 27h72M0 0v54M36 0v54" stroke="#0a1311" stroke-width="2" opacity="0.45"/>
      <path d="M0 2h72M0 29h72" stroke="#4d665e" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="360" height="480" fill="url(#bg)"/>
  <rect width="360" height="480" fill="url(#tiles)"/>
  <path d="M26 0v480M96 0v480M300 0v480" stroke="#060c0b" stroke-width="10" opacity="0.5"/>
  <path d="M0 56h360M0 148h360M0 300h360" stroke="#060c0b" stroke-width="8" opacity="0.35"/>
  <path d="M300 330l-8 40M314 210l-20 46M40 96l14 30" stroke="#2f3d37" stroke-width="2" opacity="0.35"/>
  <ellipse cx="60" cy="440" rx="150" ry="120" fill="url(#torch)"/>

  <!-- shoulders -->
  <path d="M60 480c0-66 44-106 120-106s120 40 120 106z" fill="url(#hood)"/>
  <path d="M60 480c0-66 44-106 120-106" fill="none" stroke="#3f625e" stroke-width="2" opacity="0.5"/>
  <!-- hood folds -->
  <path d="M96 418c26-22 58-32 84-32s58 10 84 32" fill="none" stroke="#1c302e" stroke-width="5"/>
  <path d="M112 432c18-14 44-22 68-22s50 8 68 22" fill="none" stroke="#456a65" stroke-width="2" opacity="0.4"/>
  <path d="M158 480v-52M202 480v-52" stroke="#162624" stroke-width="4"/>

  <!-- neck -->
  <path d="M156 244h48v78h-48z" fill="#c9aa94"/>
  <path d="M156 258c16 10 32 10 48 0v18c-16 10-32 10-48 0z" fill="#b28f78"/>

  <!-- ears -->
  <ellipse cx="108" cy="178" rx="14" ry="24" fill="#d2b49d" stroke="#141119" stroke-width="2"/>
  <ellipse cx="252" cy="178" rx="14" ry="24" fill="#d2b49d" stroke="#141119" stroke-width="2"/>
  <path d="M104 168c4 6 6 12 4 18M256 168c-4 6-6 12-4 18" fill="none" stroke="#b08b74" stroke-width="1.6"/>

  <!-- face -->
  <path d="M180 92c46 0 72 32 72 86 0 54-30 96-72 96s-72-42-72-96c0-54 26-86 72-86z" fill="#e0c6b2" stroke="#141119" stroke-width="2.5"/>
  <path d="M112 168c-4 24 2 58 18 78-18-10-30-40-30-70 0-16 4-30 12-42z" fill="#c8a58d" stroke="none"/>
  <path d="M248 168c4 24-2 58-18 78 18-10 30-40 30-70 0-16-4-30-12-42z" fill="#c8a58d" stroke="none"/>
  <path d="M120 210c10 20 26 32 44 38-18 8-40-8-48-30z" fill="#cfae96" stroke="none" opacity="0.8"/>
  <path d="M234 214c-8 18-22 30-40 36 18 8 38-6 46-26z" fill="#cfae96" stroke="none" opacity="0.8"/>

  <!-- hair -->
  <path d="M180 88c-42 0-70 26-74 68-2-42 10-74 34-84 18-8 40-8 58 0 20 9 34 26 38 50-4-20-20-34-56-34z" fill="#1a1f23" stroke="#141119" stroke-width="2"/>
  <path d="M108 150c-2-32 10-58 30-70 18-11 42-13 62-6-28 0-52 12-66 32-10 15-16 30-18 48z" fill="#242b31"/>
  <path d="M118 128c8-20 24-34 44-40-12 12-20 26-24 44-6-2-13-3-20-4z" fill="#2d353c" opacity="0.9"/>
  <path d="M112 196c-6 4-8 14-6 24 2 8 6 12 10 14-2-14-2-26-4-38z" fill="#1a1f23"/>
  <path d="M248 196c6 4 8 14 6 24-2 8-6 12-10 14 2-14 2-26 4-38z" fill="#1a1f23"/>
  <path d="M144 100c10-8 24-12 36-12s26 4 36 12c-12-4-24-6-36-6s-24 2-36 6z" fill="#2f3840" opacity="0.7"/>

  <!-- brows -->
  <path d="M132 152c10-7 22-8 32-3M228 152c-10-7-22-8-32-3" fill="none" stroke="#2a211c" stroke-width="5" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="150" cy="172" rx="18" ry="14" fill="#f2ede1" stroke="#8f6f5c" stroke-width="1.5"/>
  <ellipse cx="210" cy="172" rx="18" ry="14" fill="#f2ede1" stroke="#8f6f5c" stroke-width="1.5"/>
  <circle cx="152" cy="173" r="8" fill="#3d4c43"/>
  <circle cx="208" cy="173" r="8" fill="#3d4c43"/>
  <circle cx="152" cy="173" r="4" fill="#101617"/>
  <circle cx="208" cy="173" r="4" fill="#101617"/>
  <circle cx="154" cy="170" r="2" fill="#fbf7ea"/>
  <circle cx="210" cy="170" r="2" fill="#fbf7ea"/>
  <path d="M132 168c10-6 22-6 32 0M228 168c-10-6-22-6-32 0" fill="none" stroke="#b08b74" stroke-width="1.5"/>
  <path d="M134 186c8 6 18 8 28 5M226 186c-8 6-18 8-28 5" fill="none" stroke="#b8927b" stroke-width="1.8" opacity="0.8"/>
  <path d="M138 199c6 4 14 5 21 2M222 199c-6 4-14 5-21 2" fill="none" stroke="#bf9a83" stroke-width="1.4" opacity="0.55"/>

  <!-- nose -->
  <path d="M180 180v24c0 6-4 10-9 12" fill="none" stroke="#a9856f" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M171 216c4 3 10 4 15 2" fill="none" stroke="#8d6a58" stroke-width="2"/>
  <ellipse cx="188" cy="212" rx="10" ry="5" fill="#b28c76" opacity="0.35" stroke="none"/>

  <!-- mouth -->
  <path d="M162 231c10-4 26-4 36 0-8 8-28 8-36 0z" fill="#7c4a44" stroke="#5e332f" stroke-width="1.5"/>
  <path d="M162 231c10 3 26 3 36 0" fill="none" stroke="#9c645a" stroke-width="2"/>
  <path d="M170 243c8 4 16 4 22 0" fill="none" stroke="#a67f68" stroke-width="1.6" opacity="0.7"/>

  <!-- cheek grime and plaster -->
  <path d="M214 210l26-6 5 17-26 7z" fill="#d8c9a6" stroke="#b9a77f" stroke-width="1.2"/>
  <path d="M220 212l2 6M228 210l2 6" stroke="#a9997b" stroke-width="1.2"/>
  <path d="M132 222c6 6 13 9 20 9-6 4-16 2-22-8z" fill="#c5a28a" opacity="0.6" stroke="none"/>
  <path d="M236 190c4 3 7 7 8 12-1 5-3 9-7 12" fill="none" stroke="#cbaa92" stroke-width="2" opacity="0.6"/>

  <!-- underlight from the flashlight -->
  <path d="M120 240c14 22 34 34 60 34s46-12 60-34c-6 26-30 44-60 44s-54-18-60-44z" fill="#f4c87e" opacity="0.10" stroke="none"/>
  <rect width="360" height="480" fill="url(#vig)"/>
</svg>
