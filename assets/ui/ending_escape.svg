    <path d="M596 792l-10-58 10-4 12 58zM616 792l10-58-10-4-12 58z" fill="#232b29"/>
    <path d="M592 734c-6-22-4-40 2-52 6-12 20-16 30-8 10 8 12 26 6 44l6 18h-16l-8-18-4 18z" fill="#2c3c39"/>
