    <path d="M760 640h820v24H760z" fill="#050808"/>
    <path d="M800 212h120v96H800zM960 212h120v96H960zM1120 212h120v96h-120zM1280 212h120v96h-120zM1440 212h100v96h-100z" fill="#0e1716" stroke="#26322f" stroke-width="3"/>
    <path d="M800 348h120v96H800zM960 348h120v96H960zM1280 348h120v96h-120zM1440 348h100v96h-100z" fill="#0e1716" stroke="#26322f" stroke-width="3"/>
    <path d="M800 484h120v96H800zM960 484h120v96H960zM1120 484h120v96h-120zM1280 484h120v96h-120zM1440 484h100v96h-100z" fill="#0d1514" stroke="#222e2b" stroke-width="3"/>
