<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Финал — выход</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1218"/><stop offset="0.5" stop-color="#1d2a30"/><stop offset="0.8" stop-color="#4a5654"/><stop offset="1" stop-color="#8a948c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3633"/><stop offset="0.4" stop-color="#1a2321"/><stop offset="1" stop-color="#070b0a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2524"/><stop offset="1" stop-color="#0b1110"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdb95" stop-opacity="0.9"/><stop offset="0.35" stop-color="#d99a45" stop-opacity="0.4"/><stop offset="1" stop-color="#d99a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dawn" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#cdd6c4" stop-opacity="0.28"/><stop offset="0.6" stop-color="#8d9d92" stop-opacity="0.08"/><stop offset="1" stop-color="#8d9d92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.6" stop-color="#000" stop-opacity="0.16"/><stop offset="1" stop-color="#000" stop-opacity="0.84"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
