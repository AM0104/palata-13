<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128">
  <title>Призрак медсестры</title>
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#d3e7df" stop-opacity="0.28"/><stop offset="0.6" stop-color="#9fc3bb" stop-opacity="0.10"/><stop offset="1" stop-color="#9fc3bb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e2eadd"/><stop offset="0.65" stop-color="#c4d1c3"/><stop offset="1" stop-color="#93a396"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="52" r="48" fill="url(#halo)"/>
  <g stroke="#1a2422" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <!-- dress -->
    <path d="M38 36c-8 4-13 12-14 24l-3 26 5 1 4-14 2 18 5-1 2-15 2 24 6-1 1-23 3 15 5 1 2-18 4 14 5-1-3-26c-1-12-6-20-14-24z" fill="url(#dress)"/>
    <path d="M38 36l6 8h8l6-8 4 3-10 13H44L34 39z" fill="#f0f1e4" opacity="0.7"/>
    <!-- apron -->
    <path d="M40 54h16v44l-8 3-8-3z" fill="#eef0e5" opacity="0.55"/>
    <path d="M38 58h20" stroke="#a9b6aa" stroke-width="1.4"/>
    <!-- arms folded -->
    <path d="M28 48c-4 6-5 15-3 24l5-1 2-16zM68 48c4 6 5 15 3 24l-5-1-2-16z" fill="#ccd8ca"/>
    <path d="M34 78c8-6 20-6 28 0 2 2 1 5-1 6-8-4-18-4-26 0-2-1-3-4-1-6z" fill="#c3d0c2"/>
    <path d="M38 84c6-2 14-2 20 0" fill="none" stroke="#8fa093" stroke-width="1.2"/>
    <!-- head -->
    <ellipse cx="48" cy="22" rx="9.5" ry="11" fill="#d7e3d9"/>
    <path d="M38 20c0-8 4-12 10-12s10 4 10 12c0-4-2-7-5-8-2 1-5 1-7 0-3 1-6 4-8 8z" fill="#3a352c"/>
    <path d="M39 19c-2 2-3 5-2 8M57 19c2 2 3 5 2 8" fill="none" stroke="#3a352c" stroke-width="2"/>
    <!-- nurse cap -->
    <path d="M38 12c2-5 6-7 10-7s8 2 10 7l-3 3c-2-3-4-4-7-4s-5 1-7 4z" fill="#eef1e4" stroke="#8a978b" stroke-width="1.2"/>
    <path d="M45 7h6v3h-6z" fill="#8f4a42" opacity="0.5" stroke="none"/>
    <!-- hollow eyes -->
    <ellipse cx="44" cy="22" rx="2.4" ry="2.8" fill="#0f1615" stroke="none"/>
    <ellipse cx="52" cy="22" rx="2.4" ry="2.8" fill="#0f1615" stroke="none"/>
    <circle cx="44.5" cy="21.2" r="0.6" fill="#e8f2ec" stroke="none"/>
    <circle cx="52.5" cy="21.2" r="0.6" fill="#e8f2ec" stroke="none"/>
    <path d="M45 29c2 1 4 1 6 0" fill="none" stroke="#5a6a60" stroke-width="1.1"/>
    <!-- blood on apron -->
    <path d="M46 70l3 10-2 4-3-9z" fill="#5f2a26" opacity="0.45" stroke="none"/>
    <path d="M51 88l2 5-2 2-2-5z" fill="#5f2a26" opacity="0.35" stroke="none"/>
    <!-- feet -->
    <path d="M38 116c-2 2-2 5 1 6h8v-6zM58 116c2 2 2 5-1 6h-8v-6z" fill="#c4d2c5"/>
  </g>
</svg>
