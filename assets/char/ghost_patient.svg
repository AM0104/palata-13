<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128">
  <title>Призрак пациента</title>
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#cfe6de" stop-opacity="0.30"/><stop offset="0.6" stop-color="#9fc3bb" stop-opacity="0.10"/><stop offset="1" stop-color="#9fc3bb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gown" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#dce8e1"/><stop offset="0.65" stop-color="#b9cdc6"/><stop offset="1" stop-color="#8fa8a1"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="54" r="50" fill="url(#halo)"/>
  <g stroke="#1a2422" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <!-- tattered gown -->
    <path d="M40 34c-8 4-13 12-14 22l-3 30 6 1 4-18 2 22 6-2 2-18 2 28 6-1 1-27 3 18 6 2 2-22 4 18 6-1-3-30c-1-10-6-18-14-22z" fill="url(#gown)"/>
    <path d="M40 34l8 8 8-8 4 4-12 12-12-12z" fill="#a9bdb6"/>
    <!-- arms hanging -->
    <path d="M27 52c-4 6-6 16-4 26l5-1 3-18z" fill="#c6d8d1"/>
    <path d="M69 52c4 6 6 16 4 26l-5-1-3-18z" fill="#b4c8c1"/>
    <path d="M23 78c2-2 5-1 6 1 1 3 0 6-3 7-3 1-5-1-5-4 0-2 0-3 2-4z" fill="#b9cec7"/>
    <path d="M73 78c-2-2-5-1-6 1-1 3 0 6 3 7 3 1 5-1 5-4 0-2 0-3-2-4z" fill="#a9c0b9"/>
    <!-- bare feet -->
    <path d="M38 116c-2 2-2 5 1 6h8v-6zM58 116c2 2 2 5-1 6h-8v-6z" fill="#b3c9c2"/>
    <!-- head -->
    <ellipse cx="48" cy="22" rx="9" ry="11" fill="#d5e4dd"/>
    <path d="M39 19c0-7 4-11 9-11s9 4 9 11c0-4-2-6-4-7-2 1-4 1-6 0-3 1-5 3-8 7z" fill="#26302d"/>
    <path d="M40 26c2 4 5 6 8 6s6-2 8-6" fill="#b9cec7" stroke="none"/>
    <!-- hollow eyes -->
    <ellipse cx="44" cy="21" rx="2.6" ry="3" fill="#101817" stroke="none"/>
    <ellipse cx="52" cy="21" rx="2.6" ry="3" fill="#101817" stroke="none"/>
    <circle cx="44.6" cy="20.2" r="0.7" fill="#e9f3ee" stroke="none"/>
    <circle cx="52.6" cy="20.2" r="0.7" fill="#e9f3ee" stroke="none"/>
    <path d="M46 28c2 1 3 1 4 0" fill="none" stroke="#4a5a55" stroke-width="1.2"/>
    <!-- stains -->
    <path d="M44 66l4 8-3 4-4-7z" fill="#5c2a26" opacity="0.5" stroke="none"/>
    <path d="M54 84l3 6-2 3-3-6z" fill="#5c2a26" opacity="0.35" stroke="none"/>
  </g>
</svg>
